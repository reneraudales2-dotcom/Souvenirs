<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Iglesia</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <nav class="bg-blue-700 text-white shadow-md p-4 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">⛪</span>
                <h1 class="text-2xl font-bold tracking-wide">Sistema de Ventas - Iglesia</h1>
            </div>
            <div class="flex items-center space-x-2 bg-blue-800 px-3 py-1.5 rounded-full text-sm">
                <span class="w-2.5 h-2.5 bg-green-400 rounded-full animate-pulse"></span>
                <span class="font-medium">Servidor En Línea</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pb-12">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        📦 Catálogo de Artículos
                    </h2>
                    <span class="text-sm text-gray-500 bg-white px-3 py-1 rounded-md shadow-sm border">
                        Actualización en tiempo real
                    </span>
                </div>
                
                <div id="grid-productos" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="col-span-full bg-white p-8 rounded-xl shadow-sm border border-gray-200 text-center">
                        <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mb-2"></div>
                        <p class="text-gray-500 font-medium">Conectando con el inventario de Supabase...</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-md border border-gray-200 p-6 sticky top-6 flex flex-col max-h-[calc(100vh-120px)]">
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2 border-b pb-3">
                        🛒 Cuenta Actual
                    </h2>
                    
                    <div id="carrito-items" class="flex-1 overflow-y-auto space-y-4 pr-1 my-2 min-h-[150px]">
                        <div class="text-center py-8 text-gray-400">
                            <span class="text-4xl block mb-2">🛍️</span>
                            <p class="text-sm">El carrito está vacío.</p>
                            <p class="text-xs text-gray-400 mt-1">Presiona "Agregar" en cualquier producto.</p>
                        </div>
                    </div>
                    
                    <div class="border-t pt-4 mt-auto">
                        <div class="flex justify-between items-center font-black text-xl text-gray-900 mb-6">
                            <span>Total a Pagar:</span>
                            <span id="cart-total" class="text-blue-700">L. 0.00</span>
                        </div>
                        
                        <button 
                            id="btn-pagar" 
                            class="w-full bg-green-600 hover:bg-green-700 text-white text-lg font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-xl transition-all duration-150 transform active:scale-[0.98] flex justify-center items-center gap-2"
                        >
                            💵 Procesar Venta
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
